[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phytospectra-vlm"
version = "3.0.0"
description = "Clean from-scratch HyperLeaf2024 PhytoSpectra-VLM pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy", "pandas", "scipy", "scikit-learn", "tifffile", "Pillow",
  "PyYAML", "torch", "transformers", "peft", "accelerate", "matplotlib"
]

[project.optional-dependencies]
app = ["fastapi", "uvicorn[standard]", "python-multipart"]
dev = ["pytest"]

[project.scripts]
phytospectra = "phytospectra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "chatbot_app/backend"]

